apiVersion: apps/v1
kind:       Deployment
metadata:
  name:      librak8s-react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: librak8s-react
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge:       1
  template:
    metadata:
      labels:
        app: librak8s-react
    spec:
      containers:
        - name:            librak8s-react
          image:           librak8s-react:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds:       5
            failureThreshold:    3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds:       10
            failureThreshold:    3