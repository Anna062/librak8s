apiVersion: apps/v1
kind: Deployment
metadata:
  name: librak8s-db
  namespace: back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librak8s-db
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: librak8s-db
    spec:
      containers:
        - name:            librak8s-api-db
          image:           postgres
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432

          envFrom:
            - configMapRef:
                name: librak8s-api-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librak8s-api-secret
                  key: DB_PASSWORD